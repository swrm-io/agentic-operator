# permissions for end users to edit claudejobs.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: agentic-operator
    app.kubernetes.io/managed-by: kustomize
  name: claudejob-editor-role
rules:
- apiGroups:
  - agentic.swrm.io
  resources:
  - claudejobs
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - agentic.swrm.io
  resources:
  - claudejobs/status
  verbs:
  - get
