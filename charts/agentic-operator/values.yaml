## Operator manager image
image:
  repository: ghcr.io/swrm-io/agentic-operator
  tag: ""  # defaults to .Chart.AppVersion
  pullPolicy: IfNotPresent

imagePullSecrets: []

## Number of operator replicas. More than 1 requires leaderElection=true.
replicaCount: 1

## Enable leader election (required when replicaCount > 1)
leaderElection: true

## Namespace to deploy the operator into.
## Defaults to the Helm release namespace.
namespaceOverride: ""

serviceAccount:
  ## Name of the ServiceAccount to create/use.
  ## Defaults to the chart fullname.
  name: ""

## Resource requests and limits for the manager container
resources:
  limits:
    cpu: 500m
    memory: 128Mi
  requests:
    cpu: 10m
    memory: 64Mi

## Install CRDs as part of this chart.
## Set to false if you manage CRDs separately.
installCRDs: true

## Pod-level security context
podSecurityContext:
  runAsNonRoot: true

## Container-level security context
securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

## Node selector, tolerations, and affinity
nodeSelector: {}
tolerations: []
affinity: {}

## Extra environment variables injected into the manager container
extraEnv: []
# - name: SOME_VAR
#   value: "some-value"
