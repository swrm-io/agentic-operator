name: Release

on:
  push:
    tags:
      - 'v*'

env:
  REGISTRY: ghcr.io
  OPERATOR_IMAGE: ghcr.io/${{ github.repository_owner }}/agentic-operator
  CLAUDE_IMAGE: ghcr.io/${{ github.repository_owner }}/claude-code

jobs:
  build-operator:
    name: Build and push operator image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract tag
        id: meta
        run: echo "tag=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build and push operator image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.OPERATOR_IMAGE }}:${{ steps.meta.outputs.tag }}
            ${{ env.OPERATOR_IMAGE }}:latest
          cache-from: type=gha,scope=operator
          cache-to: type=gha,mode=max,scope=operator

  build-claude:
    name: Build and push claude-code image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract tag
        id: meta
        run: echo "tag=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build and push claude-code image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.claude
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.CLAUDE_IMAGE }}:${{ steps.meta.outputs.tag }}
            ${{ env.CLAUDE_IMAGE }}:latest
          cache-from: type=gha,scope=claude
          cache-to: type=gha,mode=max,scope=claude

  release:
    name: Create GitHub release with binaries
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Extract tag
        id: meta
        run: echo "tag=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build binaries
        run: |
          mkdir -p dist
          GOOS=linux  GOARCH=amd64 go build -ldflags="-s -w -X main.version=${{ steps.meta.outputs.tag }}" -o dist/manager-linux-amd64   ./cmd/

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/manager-*
