name: Release

on:
  push:
    tags:
      - 'v*'

env:
  REGISTRY: ghcr.io
  OPERATOR_IMAGE: ghcr.io/${{ github.repository_owner }}/agentic-operator
  CLAUDE_IMAGE: ghcr.io/${{ github.repository_owner }}/claude-code

jobs:
  build-operator:
    name: Build operator image (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract tag
        id: meta
        run: echo "tag=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build and push operator image digest
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ env.OPERATOR_IMAGE }}:${{ steps.meta.outputs.tag }}-${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}
          cache-from: type=gha,scope=operator-${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=operator-${{ matrix.platform }}

  merge-operator:
    name: Merge operator multi-platform manifest
    runs-on: ubuntu-latest
    needs: build-operator
    permissions:
      contents: read
      packages: write
    steps:
      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract tag
        id: meta
        run: echo "tag=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Create and push manifest
        run: |
          docker buildx imagetools create \
            --tag ${{ env.OPERATOR_IMAGE }}:${{ steps.meta.outputs.tag }} \
            --tag ${{ env.OPERATOR_IMAGE }}:latest \
            ${{ env.OPERATOR_IMAGE }}:${{ steps.meta.outputs.tag }}-amd64 \
            ${{ env.OPERATOR_IMAGE }}:${{ steps.meta.outputs.tag }}-arm64

  build-claude:
    name: Build claude-code image (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract tag
        id: meta
        run: echo "tag=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build and push claude-code image digest
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.claude
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ env.CLAUDE_IMAGE }}:${{ steps.meta.outputs.tag }}-${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}
          cache-from: type=gha,scope=claude-${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=claude-${{ matrix.platform }}

  merge-claude:
    name: Merge claude-code multi-platform manifest
    runs-on: ubuntu-latest
    needs: build-claude
    permissions:
      contents: read
      packages: write
    steps:
      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract tag
        id: meta
        run: echo "tag=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Create and push manifest
        run: |
          docker buildx imagetools create \
            --tag ${{ env.CLAUDE_IMAGE }}:${{ steps.meta.outputs.tag }} \
            --tag ${{ env.CLAUDE_IMAGE }}:latest \
            ${{ env.CLAUDE_IMAGE }}:${{ steps.meta.outputs.tag }}-amd64 \
            ${{ env.CLAUDE_IMAGE }}:${{ steps.meta.outputs.tag }}-arm64

  release:
    name: Create GitHub release with binaries
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Extract tag
        id: meta
        run: echo "tag=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build binaries
        run: |
          mkdir -p dist
          GOOS=linux  GOARCH=amd64 go build -ldflags="-s -w -X main.version=${{ steps.meta.outputs.tag }}" -o dist/manager-linux-amd64   ./cmd/
          GOOS=linux  GOARCH=arm64 go build -ldflags="-s -w -X main.version=${{ steps.meta.outputs.tag }}" -o dist/manager-linux-arm64   ./cmd/
          GOOS=darwin GOARCH=amd64 go build -ldflags="-s -w -X main.version=${{ steps.meta.outputs.tag }}" -o dist/manager-darwin-amd64  ./cmd/
          GOOS=darwin GOARCH=arm64 go build -ldflags="-s -w -X main.version=${{ steps.meta.outputs.tag }}" -o dist/manager-darwin-arm64  ./cmd/

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/manager-*
